[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "python-email-mime-tree"
version = "1.0.0"
description = "Read-only MIME structure inspector for local .eml files"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = []

[project.scripts]
email-mime-tree = "email_mime_tree:main"

[tool.setuptools]
py-modules = ["email_mime_tree"]
